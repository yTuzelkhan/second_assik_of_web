<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="248595983.jpeg">
  <title>Grid System</title>

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f0f0f0;
    }
    .layout-container {
      display: grid;
      grid-template-columns: 200px 1fr;  
      grid-template-rows: auto 200px auto; 
      grid-template-areas:
        "header  header"
        "sidebar main"
        "footer  footer";
      gap: 10px;
      margin-bottom: 40px;
    }
    .header {
      grid-area: header;
      background: #333;
      color: white;
      padding: 15px;
      text-align: center;
    }
    .sidebar {
      grid-area: sidebar;
      background: #ccc;
      padding: 15px;
    }
    .sidebar ul{
      display : flex;
      flex-direction: column;
      gap: 10px;
    }
    .sidebar a{
      color: #020202;
    }
    .main {
      grid-area: main;
      background: #fff;
      padding: 15px;
    }
    .main p{
      font-size: 20px;
      color: #020202;
    }
    .footer {
      grid-area: footer;
      background: #333;
      color: white;
      padding: 15px;
      text-align: center;
    }
    .gallery-container {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
       gap: 10px;                            
    }
    .gallery-item {
      position: relative; 
    }
    .gallery-item img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }
    .caption {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .gallery-item:hover .caption {
      opacity: 1;
    }
  </style>
</head>
<body>

  <h1>Grid System</h1>
  <div class="layout-container">
    <div class="header">Header</div>
    <div class="sidebar">
      <ul>

      </ul>
    </div>

    <div class="footer">Footer</div>
  </div>
